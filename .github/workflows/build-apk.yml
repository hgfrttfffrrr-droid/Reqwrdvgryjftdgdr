name: Build BirGram APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # مرحله حیاتی: ساختن فایل تنظیمات با اطلاعات API شما
    - name: Create local.properties
      run: |
        echo "api_id=YOUR_API_ID" > local.properties
        echo "api_hash=YOUR_API_HASH" >> local.properties
        # اگر SDK لازم بود، اینجا مسیرش رو ست میکنیم
        echo "sdk.dir=$ANDROID_HOME" >> local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BirGram-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
